# S.T.E.A.M Features — éditable ici ou via tools/feature_gui.py

# ── Mode service ──────────────────────────────────────────────────
# "prod" : session client réelle — visible sur /view et dans les logs comme
#          STANDBY (en attente d'une carte) / WORKING (effet en cours)
# "dev"  : hors session, pour développement/tests — purement informatif,
#          ne change aucun comportement du pipeline (Loxone/vidéo/audio
#          continuent de fonctionner normalement)
service_mode: "prod"

# ── Mode pipeline ─────────────────────────────────────────────────
# "card"   : scan continu de la carte → hold 2s → vidéo + UDP   (défaut STYX)
# "person" : YOLO détecte joueur X secondes → joue un MP3
pipeline_mode: "card"

# ── Mode carte ────────────────────────────────────────────────────
card_hold_ms: 1000          # ms de maintien de la carte avant déclenchement
idle_after_s: 3.0           # secondes avant retour en IDLE après trigger

# ── Mode person (ignoré si pipeline_mode=card) ───────────────────
person_duration: 2.0        # secondes de présence continue pour déclencher
persist_after_loss: 5.0     # persistance joueur après disparition

# ── Détection carte ───────────────────────────────────────────────
card_min_area: 4000         # aire minimale du losange (px)
card_min_matches: 12        # keypoints ORB minimum pour valider
card_score_threshold: 0.20  # score minimum ORB (0.0–1.0)
card_consec_frames: 1       # nb de frames consécutives pour démarrer le hold — 1 bonne frame suffit, L2+L3 vérifient déjà géométrie+score
card_miss_grace_frames: 5   # frames ratées d'affilée tolérées PENDANT le hold sans tout reset (bruit caméra isolé)

# Modèle générique préparé pour benchmark/profils. Le runtime STYX actuel
# continue volontairement d'utiliser card_score_threshold ci-dessus tant que
# les mesures terrain n'ont pas validé une migration explicite.
recognition:
  default_threshold: 0.20
  use_per_object_thresholds: false
  # Score L3 : "global" (production : bons_matchs / max(points template, requête)),
  # "template" (/ points template seuls : insensible à un doigt ou au décor autour)
  # ou "zones" (carte en 2x2, moyenne des 3 meilleures zones : tolère une zone
  # masquée). Les échelles diffèrent : tout autre mode que "global" exige de
  # recalibrer default_threshold / seuils par objet au benchmark (--score-mode).
  score_mode: "global"

# Seuils optionnels par objet, sans activation automatique.
objects: {}

# ── Features optionnelles ─────────────────────────────────────────
enable_heartbeat: true      # UDP heartbeat toutes les 5s (broadcast LAN)
enable_monitor: true        # WebSocket monitor  ws://0.0.0.0:8889
enable_rule_api: true       # Rule editor HTTP   http://0.0.0.0:8890
enable_audio: true          # lecture audio sur détection
enable_video: true          # lecture vidéo sur détection
enable_stream: true         # serveur MJPEG + page /view  http://0.0.0.0:5050
enable_snapshots: false     # JPEG de la frame à chaque carte validée (diagnostic) — voir snapshot_*
snapshot_dir: "/dev/shm/steam_snapshots"  # RAM par défaut = zéro usure SD (perdu au reboot) ; clé USB pour conserver
snapshot_max_files: 50      # rotation : on garde les N plus récents
snapshot_min_interval_s: 5.0  # espacement minimal entre deux snapshots
snapshot_jpeg_quality: 80
# Rejets (diagnostic occlusion/doigt) : L1 aucun contour, L2 contour sans carte,
# L3 score entre near_miss_ratio×seuil et le seuil. Rotation séparée des cartes validées.
snapshot_reject_max_files: 30
snapshot_reject_interval_s: 10.0   # débit min. des rejets L2/L3
snapshot_near_miss_ratio: 0.5      # L3 capturé si score >= ratio × card_score_threshold
snapshot_l1_interval_s: 0.0        # >0 : échantillonne aussi L1 (scène vide incluse) toutes les N s
# Porte de mouvement : n'exécute pas QR/L1/L2/L3 quand la scène est figée et
# qu'aucun candidat n'est en cours de validation (économie de CPU à vide).
# Une frame de contrôle passe toutes les idle_interval_s même sans mouvement.
enable_motion_gate: false
motion_gate_pixel_delta: 12       # écart de gris (0-255) pour compter un pixel comme changé
motion_gate_changed_ratio: 0.01   # fraction de la miniature qui doit changer pour parler de mouvement
motion_gate_linger_s: 2.0         # reste ouvert N s après le dernier mouvement
motion_gate_idle_interval_s: 1.0  # frame de contrôle sans mouvement (carte laissée en place)
# Repli plein cadre : quand L1 ne trouve plus de contour (ex : doigt sur le bord
# de la carte), L2/L3 cherchent la carte dans l'image entière. Borné : après N
# frames sans contour, au plus 1 tentative / interval_s, seulement si la scène
# a bougé récemment (jamais sur une salle figée), et le score doit dépasser le
# seuil de score_margin. À valider sur le corpus de négatifs (issue #9).
enable_fullframe_fallback: false
fullframe_min_l1_misses: 3
fullframe_interval_s: 0.7
fullframe_score_margin: 0.05
fullframe_motion_window_s: 5.0
enable_watchdog: true      # arrêt forcé si la boucle principale se fige (systemd relance)
watchdog_timeout_s: 20.0    # secondes sans activité avant arrêt forcé

# ── Validation GM (mode carte uniquement) ──────────────────────────
# Identifiant de la mission active sur CETTE machine — comparé au contenu
# d'un QR "STEAM_FLUX:<mission_id>" montré par le GM avant une session.
# Match -> bandeau "STEAM VISION READY" sur /view. Sinon -> bandeau
# "FLUX INATTENDU". Ne modifie jamais la config (lecture seule).
mission_id: "flux_1"

# ── Loxone / UDP ──────────────────────────────────────────────────
loxone_ip: "192.168.1.50"
loxone_port: 7777
udp_listen_port: 8888       # port d'écoute des ACK / commandes entrants

# ── Stream MJPEG ──────────────────────────────────────────────────
stream_port: 5050           # port HTTP du stream MJPEG et de la page /view

# ── Caméra ────────────────────────────────────────────────────────
camera_width: 1280
camera_height: 720
camera_rotation: 90         # 0/90/180/270 — corrige le montage physique de la caméra

# ── YOLO (mode person uniquement) ────────────────────────────────
yolo_model: "yolov8n.pt"
yolo_imgsz: 320
yolo_conf: 0.5
